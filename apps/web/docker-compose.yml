# PostgreSQL for local development
#
# Why docker-compose instead of Dockerfile?
# - PostgreSQL official image can be used as-is without customization
# - docker-compose is simpler for running existing images with configuration
# - Dockerfile is for building custom images, which is unnecessary here
#
# PostgreSQL version is matched to Supabase (production) to avoid compatibility issues.

services:
  db:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: blindfold_chess
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
